name: naijagovendorsapp
description: "NaijaGo vendor mobile app."
publish_to: "none"

version: 1.0.3+7

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  http_parser: ^4.1.2
  shared_preferences: ^2.2.3
  device_info_plus: ^11.5.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  font_awesome_flutter: ^10.8.0
  intl: ^0.18.1
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  uuid: ^4.4.0
  socket_io_client: ^2.0.3+1
  file_picker: ^8.0.0+1
  cached_network_image: ^3.2.3
  fl_chart: ^0.70.0
  lottie: ^2.2.0
  shimmer: ^3.0.0
  crypto: ^3.0.3
  photo_view: ^0.15.0
  onesignal_flutter: ^5.1.2
  equatable: any
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/categories/
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/govendors.png"
  min_sdk_android: 21
