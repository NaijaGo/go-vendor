  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.32.8
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.naijago.govendor"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.naijago.govendor

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
