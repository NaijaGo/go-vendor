workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.5
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-1m0q9ou6b8c9lskvvrh31q2s142j1pgb.apps.googleusercontent.com"
        PACKAGE_NAME: "com.naijago.govendor"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "76438b8d-4b39-49eb-805c-11eb934f5a66"
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Show Flutter version
        script: |
          flutter --version
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Analyze
        ignore_failure: true
        script: |
          flutter analyze
      - name: Run tests
        ignore_failure: true
        script: |
          flutter test
      - name: Configure Android signing
        script: |
          if [ -z "$CM_KEYSTORE" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "Missing Android signing variables. Set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic."
            exit 1
          fi

          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          {
            printf "%s\n" "storePassword=$CM_KEYSTORE_PASSWORD"
            printf "%s\n" "keyPassword=$CM_KEY_PASSWORD"
            printf "%s\n" "keyAlias=$CM_KEY_ALIAS"
            printf "%s\n" "storeFile=upload-keystore.jks"
          } > "$CM_BUILD_DIR/android/key.properties"
      - name: Build Android artifacts
        script: |
          flutter build apk --release --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

  ios-no-codesign:
    name: iOS No Codesign
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-1m0q9ou6b8c9lskvvrh31q2s142j1pgb.apps.googleusercontent.com"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "76438b8d-4b39-49eb-805c-11eb934f5a66"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install iOS pods
        script: |
          ruby --version
          pod --version
          cd ios
          pod install --repo-update
      - name: Analyze
        script: |
          flutter analyze
      - name: Run tests
        script: |
          flutter test
      - name: Build iOS without codesigning
        script: |
          dart run tool/configure_google_sign_in.dart
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
    artifacts:
      - build/ios/iphoneos/*.app
